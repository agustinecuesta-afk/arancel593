server.port=${PORT:8080}

spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

app.firebase.project-id=${FIREBASE_PROJECT_ID:arancel593}
app.firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
app.security.firebase-enabled=true
app.security.allowed-emails=${FIREBASE_AUTH_ALLOWED_EMAILS:agustincuesta1975@gmail.com}
app.data.initialize-demo=false
app.web.allowed-origins=${APP_WEB_ALLOWED_ORIGINS:https://arancel593.web.app,https://arancel593.firebaseapp.com}
